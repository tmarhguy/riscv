name: docs
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/build-docs.sh"
      - "Makefile"
      - "tools/check_docs.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/build-docs.sh"
      - "Makefile"
      - "tools/check_docs.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Single Pages deployment (the former Starlight web/ site was removed;
# this AsciiDoc manual is the canonical deployment). No gh-pages branch,
# no custom domain, no CNAME, no redirects. Generated HTML is never
# committed back to the repository.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  guardrails:
    name: links, claims, metadata, and artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run documentation guardrails
        run: python3 tools/check_docs.py
      - name: Parse workflow YAML
        run: ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |f| YAML.load_file(f) }'

  build:
    name: build manual
    runs-on: ubuntu-latest
    needs: guardrails
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Asciidoctor
        run: sudo apt-get update && sudo apt-get install -y asciidoctor
      - name: Build manual (same script as local `make docs`)
        run: ./scripts/build-docs.sh
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs

  deploy:
    name: deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
