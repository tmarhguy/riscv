name: rtl
on:
  push:
    branches: [main]
    paths:
      - "rtl/**"
      - "tb/**"
      - "Makefile"
      - "docker/Dockerfile.ci"
      - ".github/workflows/rtl.yml"
  pull_request:
    paths:
      - "rtl/**"
      - "tb/**"
      - "Makefile"
      - "docker/Dockerfile.ci"
      - ".github/workflows/rtl.yml"
  workflow_dispatch:

jobs:
  lint:
    name: verible + verilator lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Verilator + Verible
        run: sudo apt-get update && sudo apt-get install -y verilator verible-verilog-lint || (sudo apt-get install -y verilator && echo "verible via binary fallback skipped")
      - name: Lint
        run: make lint

  unit:
    name: unit + cocotb smoke
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # cocotb 2.x needs a newer Verilator VPI API than Ubuntu 5.020.
      - uses: YosysHQ/setup-oss-cad-suite@0d9c798a9db910ff8ea5e3b6ba077a4e5847f352 # v3
        with:
          version: "2026-10-01"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install python deps
        run: pip install -r requirements.txt
      - name: Unit + smoke
        run: make unit cocotb-smoke
