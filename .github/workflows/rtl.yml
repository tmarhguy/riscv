name: rtl
on:
  push:
    branches: [main]
    paths:
      - "rtl/**"
      - "tb/**"
      - "Makefile"
      - "docker/Dockerfile.ci"
      - ".github/workflows/rtl.yml"
  pull_request:
    paths:
      - "rtl/**"
      - "tb/**"
      - "Makefile"
      - "docker/Dockerfile.ci"
      - ".github/workflows/rtl.yml"
  workflow_dispatch:

jobs:
  lint:
    name: verible + verilator lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Verilator + Verible
        run: sudo apt-get update && sudo apt-get install -y verilator verible-verilog-lint || (sudo apt-get install -y verilator && echo "verible via binary fallback skipped")
      - name: Lint
        run: make lint

  unit:
    name: unit + cocotb smoke
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359bdac14c6b2e189 # v5
        with:
          python-version: "3.12"
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Install python deps
        run: pip install -r requirements.txt
      - name: Unit + smoke
        run: make unit cocotb-smoke
