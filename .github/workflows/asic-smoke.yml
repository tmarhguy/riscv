name: asic-smoke
on:
  push:
    branches: [main]
    paths:
      - "rtl/**"
      - "asic/**"
      - "scripts/synth/**"
      - ".github/workflows/asic-smoke.yml"
  pull_request:
    paths:
      - "rtl/**"
      - "asic/**"
      - "scripts/synth/**"
      - ".github/workflows/asic-smoke.yml"
  workflow_dispatch:

jobs:
  synth:
    name: yosys synth smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Yosys
        run: sudo apt-get update && sudo apt-get install -y yosys
      - name: Synth top
        run: make synth
